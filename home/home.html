<!DOCTYPE html>
<html lang="en">
   
    <head>
    
        <title>QR GENERATOR</title>
        <link rel="icon" type="image/x-icon" href="../src/images/favicon.png">
        <!-- aos cdn -->
        <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
        <!-- stylesheet -->
        <link rel="stylesheet" href="home.css">
        <!-- fontawesome -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous" />
      
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Passions+Conflict&family=Orbitron&family=Fira+Code&family=Orbitron">
        <!-- google icons -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
     
      </head>
<body>
    <header></header>
    <main>
        <div class="top-logo-container">
            <img src="../src/images/logo-for-black.png" alt="">
        </div>

        <div class="main-container">      
            <input type="text" name="text" class="input" id="input" placeholder="Enter Text here...." required>
            <button class="submit" id="submit">GENERATE</button>

        </div>

        <div class="Qr-container" id="Qr-container">
            <div class="loader" id="loader">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
                <div class="bar4"></div>
                <div class="bar5"></div>
                <div class="bar6"></div>
                <div class="bar7"></div>
                <div class="bar8"></div>
                <div class="bar9"></div>
                <div class="bar10"></div>
                <div class="bar11"></div>
                <div class="bar12"></div>
            </div>
            <img src="" alt="" class="qr-code" id="qr-code">
            <div class="buttonContainer">
                <div class="downloadBtnContainer">
                    <h1 class="downloadHeading">Download</h1>
                    <div class="buttonRow">
                    <button class="download" id="forjpg">JPG</button>
                    <button class="download" id="forpng">PNG</button>
                    <button class="download" id="forsvg">SVG</button>
                </div>
                </div>
                
                <div class="exit" id="exit">
                    <div class="line1"></div>
                    <div class="line2"></div>
                </div>
            </div>
            
        </div>
    </main>
    <footer>
        <div class="footerContainer">
            <p>Design & Built by <a href="***">@Fazlur Rehman </a>| <i class="far fa-copyright"></i> 2024</p>
        </div>
    </footer>
    <!-- Custom animated cursor -->
<div class="custom-cursor"></div>

<!-- Your content -->
<button class="interactive-element">Hover Me</button>

<style>
/* Hide default cursor */
body {
  cursor: none;
}

/* Custom cursor styling */
.custom-cursor {
  position: fixed;
  width: 20px;
  height: 20px;
  background: #4CAF50;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: all 0.1s ease;
  z-index: 9999;
}

/* Cursor effects on hover */
.interactive-element:hover ~ .custom-cursor,
.custom-cursor.hover {
  transform: translate(-50%, -50%) scale(2);
  background: #ff5722;
  border: 2px solid #fff;
}
</style>

<script>
// Track mouse movement
document.addEventListener('mousemove', (e) => {
  const cursor = document.querySelector('.custom-cursor');
  cursor.style.left = `${e.pageX}px`;
  cursor.style.top = `${e.pageY}px`;
});

// Add hover effect to interactive elements
document.querySelectorAll('.interactive-element').forEach(item => {
  item.addEventListener('mouseenter', () => {
    document.querySelector('.custom-cursor').classList.add('hover');
  });
  item.addEventListener('mouseleave', () => {
    document.querySelector('.custom-cursor').classList.remove('hover');
  });
});
</script>
</body>
<script src="script.js"></script>
<script src="FileSaver.js"></script>
</html>
